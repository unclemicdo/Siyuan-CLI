interface:
  display_name: "Siyuan CLI"
  short_description: "Use the Siyuan CLI safely and efficiently"
  default_prompt: "Use $siyuan-cli to choose the right Siyuan CLI commands, prefer JSON output, run `system version --json` as preflight for live targets, prefer `workflow doc-upsert` for path-based create-or-append writes, prefer `doc create --markdown-file` or `block append --data-file` for multiline content, resolve readable note paths with `doc resolve-path` or `path ...` before block mutations, use `av ...` for Attribute View work instead of SQL writes, treat `template render` as an official API passthrough that requires `--id` plus a workspace absolute `.sy` file path, treat `file ...` as managed scope storage only rather than arbitrary filesystem access, use `npm run dev -- ...` only as a repository-root fallback when global `sy` is unavailable, consult `knowledge-management.md` for tags/backlinks/graph commands, and recover cleanly from structured CLI failures."
